[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learnlog"
version = "0.2.0"
description = "Git-native personal learning diary and learning portfolio."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Srujan Kumar" },
]
keywords = [
  "learning",
  "knowledge-management",
  "markdown",
  "git",
  "portfolio",
  "diary",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
learnlog = "learnlog.cli:main"

[project.urls]
Homepage = "https://github.com/Sujju-12/LearnLog"
Repository = "https://github.com/Sujju-12/LearnLog"
Issues = "https://github.com/Sujju-12/LearnLog/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/learnlog"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/config",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-q", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
